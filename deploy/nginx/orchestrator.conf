# =============================================================================
#  Multi-Agent Orchestrator — gabarit Nginx (reverse proxy + frontend statique)
#  Référence : docs/ARCHITECTURE.md §3.3 et §12, docs/SECURITY.md §8.
#
#  CE FICHIER EST UN GABARIT : il n'est jamais utilisé directement par Nginx.
#  Il est rendu par « deploy/setup.sh », qui produit DEUX fichiers :
#
#    région SNIPPET -> /etc/nginx/snippets/orchestrator-<domaine>.conf
#                      (règles partagées : frontend compilé + proxy vers l'API)
#    région SITE    -> /etc/nginx/sites-available/orchestrator-<domaine>
#                      (blocs server{} : écoute 80 et, si TLS, écoute 443)
#                      + lien symbolique dans /etc/nginx/sites-enabled/
#
#  Placeholders remplacés par setup.sh :
#    __DOMAIN__             domaine public (ex. api.example.com)
#    __SNIPPET_PATH__       chemin absolu du snippet à inclure
#    __FRONTEND_ROOT__      racine du frontend compilé (…/frontend/dist)
#    __ACME_WEBROOT__       racine du challenge ACME (certbot --webroot)
#    __BACKEND_UPSTREAM__   origine du backend (défaut http://127.0.0.1:8000)
#    __NGINX_ACCESS_LOG__   journal d'accès Nginx du site
#    __NGINX_ERROR_LOG__    journal d'erreurs Nginx du site
#
#  Marqueurs de rendu conditionnel (consommés par le rendu) :
#    # >>> TLSON >>>  … # <<< TLSON <<<    conservé uniquement si TLS est actif
#    # >>> TLSOFF >>> … # <<< TLSOFF <<<   conservé uniquement si TLS est inactif
#
#  Choix de sécurité :
#    - X-Forwarded-For / X-Real-IP sont ÉCRASÉS par Nginx (jamais concaténés) :
#      un client ne peut donc pas imposer l'adresse vue par le backend, qui ne
#      fait confiance qu'au proxy 127.0.0.1 (TRUSTED_PROXIES, SECURITY.md §8).
#    - Les chemins sensibles (.env, .git, scripts, base SQLite…) sont refusés
#      par défaut avant tout traitement.
#    - Les routes de documentation interactive (/docs, /redoc, /openapi.json) ne
#      sont pas publiées : ENABLE_DOCS=false en production (SECURITY.md §16.13).
# =============================================================================

# >>> SNIPPET >>>
# --- Limites, délais et furtivité du serveur ---------------------------------
client_max_body_size   8m;
client_body_timeout    15s;
client_header_timeout  15s;
send_timeout           30s;
keepalive_timeout      65s;
server_tokens          off;

# --- En-têtes de sécurité ----------------------------------------------------
# Hérités par tous les blocs location qui n'en définissent pas eux-mêmes :
# les locations ci-dessous utilisent « expires » et non « add_header » afin de
# préserver cet héritage.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options         "DENY" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# --- Refus par défaut des chemins sensibles ----------------------------------
location ~* (^|/)\.(?!well-known/)                              { deny all; }
location ~* \.(env|ini|log|sqlite|sqlite3|db|sql|bak|old|orig|sh|py|pyc|toml|lock|map|md|ya?ml)$ { deny all; }
location ~* ^/(\.git|\.svn|\.hg|node_modules|vendor)/           { deny all; }
location ~* ^/(server-status|server-info|phpmyadmin|adminer)    { deny all; }

# --- API backend (FastAPI) : /health et /api/... ------------------------------
# « ^/(health|api)(/|$) » couvre /health, /api, /api/ et /api/v1/... ; l'ancien
# motif « ^/(health|api/)(/|$) » ne matchait pas /api/v1/... (les appels de
# l'interface recevaient alors index.html au lieu du JSON du backend).
location ~ ^/(health|api)(/|$) {
    proxy_pass __BACKEND_UPSTREAM__;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Connection        "";
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    90s;
    proxy_buffering on;
}

# --- Frontend React compilé (SPA) --------------------------------------------
root  __FRONTEND_ROOT__;
index index.html;

location = /index.html  { expires -1; }
location = /favicon.ico { try_files $uri =404; expires 7d; access_log off; }
location ~* ^/(assets|static|fonts|images)/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
}
location / {
    try_files $uri $uri/ /index.html;
    expires -1;
}
# <<< SNIPPET <<<

# >>> SITE >>>
# --- HTTP : challenge ACME puis redirection (ou service direct sans TLS) -----
server {
    listen      80;
    listen      [::]:80;
    server_name __DOMAIN__;

    access_log __NGINX_ACCESS_LOG__;
    error_log  __NGINX_ERROR_LOG__ warn;

    # Émission et renouvellement Let's Encrypt sans interruption de service :
    # le challenge reste joignable en HTTP même lorsque la redirection est active.
    location ^~ /.well-known/acme-challenge/ {
        root         __ACME_WEBROOT__;
        default_type "text/plain";
        allow        all;
    }

# >>> TLSON >>>
    # TLS actif : tout le trafic HTTP est redirigé vers HTTPS (SECURITY.md §8).
    location / {
        return 301 https://$host$request_uri;
    }
# <<< TLSON <<<
# >>> TLSOFF >>>
    # TLS inactif : le service est exposé en HTTP. À corriger : relancez setup.sh
    # dès que le DNS et le certificat sont disponibles.
    include __SNIPPET_PATH__;
# <<< TLSOFF <<<
}

# >>> TLSON >>>
# --- HTTPS : terminaison TLS puis reverse proxy vers le backend --------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS : uniquement sur le site TLS (SECURITY.md §8).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log __NGINX_ACCESS_LOG__;
    error_log  __NGINX_ERROR_LOG__ warn;

    include __SNIPPET_PATH__;
}
# <<< TLSON <<<
# <<< SITE <<<

[pytest]
testpaths = tests
pythonpath = . tests
# Seuls les modules « test_*.py » sont collectés : les scripts autonomes
# (smoke_test.py, verifier_couture.py, diagnostic_couture.py) sont des
# programmes à exécuter directement, pas des modules de test.
python_files = test_*.py
addopts = -q --tb=short --strict-markers -p no:cacheprovider
markers =
    lent: test nécessitant davantage de temps (non exécuté par défaut)
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*

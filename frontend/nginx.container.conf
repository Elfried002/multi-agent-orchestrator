# =============================================================================
#  Multi-Agent Orchestrator — configuration Nginx CONTENEUR
#
#  Variante de deploy/nginx/orchestrator.conf destinée à l'image Docker
#  (docker-compose.yml) : un seul bloc server en HTTP, l'API étant jointe par le
#  nom de service « backend » sur le réseau Compose.
#
#  Le déploiement de production n'utilise PAS ce fichier : il utilise le gabarit
#  deploy/nginx/orchestrator.conf, rendu par deploy/setup.sh (TLS, certbot,
#  journalisation système). Les règles de sécurité sont volontairement alignées
#  sur ce gabarit (SECURITY.md §8) afin que la recette locale se comporte comme la
#  production.
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Journaux vers la sortie standard : « docker compose logs » les collecte.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    client_max_body_size   8m;
    client_body_timeout    15s;
    client_header_timeout  15s;
    send_timeout           30s;
    keepalive_timeout      65s;
    server_tokens          off;

    # --- En-têtes de sécurité (hérités par les locations sans add_header) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Refus par défaut des chemins sensibles -----------------------------
    location ~* (^|/)\.(?!well-known/)                                { deny all; }
    location ~* \.(env|ini|log|sqlite|sqlite3|db|sql|bak|old|orig|sh|py|pyc|toml|lock|map|md|ya?ml)$ { deny all; }
    location ~* ^/(\.git|\.svn|\.hg|node_modules|vendor)/             { deny all; }
    location ~* ^/(server-status|server-info|phpmyadmin|adminer)      { deny all; }

    # --- API backend : /health et /api/... ----------------------------------
    # « ^/(health|api)(/|$) » couvre /health, /api, /api/ et /api/v1/... ;
    # le motif « ^/(health|api/)(/|$) » ne matchait pas /api/v1/... (les appels
    # de l'interface retombaient alors sur le repli SPA : GET renvoyait du HTML
    # et POST était refusé en 405 par le service de fichiers statiques).
    location ~ ^/(health|api)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Écrasés, jamais concaténés : le client ne peut pas imposer l'adresse
        # vue par le backend (SECURITY.md §8).
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    90s;
        proxy_buffering on;
    }

    # --- Frontend React compilé (SPA) ---------------------------------------
    root  /usr/share/nginx/html;
    index index.html;

    location = /index.html  { expires -1; }
    location = /favicon.ico { try_files $uri =404; expires 7d; access_log off; }
    location ~* ^/(assets|static|fonts|images)/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
